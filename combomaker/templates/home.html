<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Combo Maker</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0e0e10;
      --surface: #18181c;
      --surface2: #222228;
      --border: #2e2e38;
      --accent: #7c5cfc;
      --accent-dim: #4a3894;
      --accent-glow: rgba(124, 92, 252, 0.25);
      --text: #e8e8f0;
      --text-muted: #888899;
      --danger: #fc5c7d;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
      --display: 'Bebas Neue', cursive;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Scanline overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.08) 3px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 3rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: var(--display);
      font-size: 2.2rem;
      letter-spacing: 0.12em;
      color: var(--text);
      line-height: 1;
    }

    .logo span {
      color: var(--accent);
    }

    /* ── Main layout ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: auto 1fr;
      gap: 0;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 3rem 2rem;
      gap: 2rem;
      align-items: start;
    }

    /* ── Sidebar controls ── */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .controls-title {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    /* Export buttons */
    .export-group {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .btn-export {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 0.8rem;
      padding: 0.7rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      letter-spacing: 0.05em;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
    }

    .btn-export:hover {
      background: var(--surface2);
      border-color: var(--accent-dim);
      color: var(--text);
    }

    /* ── Editor area ── */
    .editor-wrap {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-height: 100px;
      height: auto;
      width: 100%;
      grid-column: 1 / -1;
    }

    .editor-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .editor-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .editor-label {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    textarea#combo-input {
      width: 100%;
      height: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 1rem;
      line-height: 1.6;
      padding: 1.2rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      caret-color: var(--accent);
    }

    textarea#combo-input::placeholder {
      color: var(--text-muted);
      opacity: 0.5;
    }

    textarea#combo-input:focus {
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Preview strip */
    .preview-strip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.9rem 1.2rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--text-muted);
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .preview-strip .token {
      color: var(--accent);
      background: rgba(124,92,252,0.12);
      padding: 0.1rem 0.4rem;
      border-radius: 2px;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 1rem 3rem;
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-align: center;
    }

    /* ── Fade-in animation ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hero    { animation: fadeUp 0.5s ease both; }
    .controls{ animation: fadeUp 0.5s 0.1s ease both; }
    .editor-wrap { animation: fadeUp 0.5s 0.18s ease both; }

    /* ══════════ TECLADOS POR JUEGO ══════════ */
    #game-keyboards {
      display: none;
      width: 100%;
      grid-column: 1 / -1;
      margin-top: 1rem;
      padding: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }

    #game-keyboards .kbd-game-section {
      max-width: 1200px;
      margin: 0 auto;
      text-align: left;
    }

    .kbd-game-section {
        
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 0 30px rgba(0,0,0,0.3), 0 0 0 1px var(--accent-dim);
    }

    /* Header */
    .kbd-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .kbd-title-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
    }

    .kbd-game-badge {
      font-family: var(--display);
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      background: var(--accent);
      color: #fff;
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      line-height: 1.4;
    }

    .kbd-title {
      font-family: var(--display);
      font-size: 1.15rem;
      letter-spacing: 0.1em;
      color: var(--text);
      line-height: 1;
    }

    /* Layout del teclado */
    .kbd-layout {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 2rem;
      width: 100%;
      align-items: start;
    }

    .kbd-block {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }

    .kbd-block-label {
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .kbd-sep {
      width: 1px;
      background: var(--border);
      align-self: stretch;
      margin: 0 0.5rem;
    }

    /* Grids */
    .kbd-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 12px;
      width: 100%;
    }

    /* Keys base */
    .kbd-key {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      border-radius: 5px;
      cursor: pointer;
      padding: 0;
      width: 100%;
      min-height: 56px;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
      position: relative;
      user-select: none;
    }

    .kbd-key:active {
      transform: translateY(2px);
    }

    /* Direction keys */
    .dir-key {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-bottom: 3px solid #111;
      color: var(--text-muted);
    }

    .dir-key:hover {
      border-color: var(--accent-dim);
      color: var(--text);
      background: rgba(124,92,252,0.1);
    }

    .dir-key.active {
      background: var(--accent);
      border-color: var(--accent);
      border-bottom-color: var(--accent-dim);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .center-key {
      background: #111;
      color: #555;
    }

    /* Punch keys */
    .punch-key {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-bottom: 3px solid #0d0d1a;
      color: #8888cc;
    }

    .punch-key:hover {
      background: #222244;
      border-color: #5555aa;
      color: #aaaaee;
    }

    .punch-key.active {
      background: #4444aa;
      border-color: #7777cc;
      border-bottom-color: #222266;
      color: #fff;
      box-shadow: 0 0 12px rgba(100,100,220,0.4);
    }

    /* Kick keys */
    .kick-key {
      background: #1a2e1a;
      border: 1px solid #2a4a2a;
      border-bottom: 3px solid #0d1a0d;
      color: #88cc88;
    }

    .kick-key:hover {
      background: #224422;
      border-color: #55aa55;
      color: #aaeeaa;
    }

    .kick-key.active {
      background: #44aa44;
      border-color: #77cc77;
      border-bottom-color: #226622;
      color: #fff;
      box-shadow: 0 0 12px rgba(100,220,100,0.4);
    }

    /* Special keys */
    .spec-key {
      background: #2e1a10;
      border: 1px solid #4a2a1a;
      border-bottom: 3px solid #1a0d08;
      color: #cc9966;
      font-size: 0.7rem;
    }

    .spec-key:hover {
      background: #442211;
      border-color: #aa7744;
      color: #eebb88;
    }

    .spec-key.active {
      background: #aa6633;
      border-color: #cc9966;
      border-bottom-color: #663311;
      color: #fff;
      box-shadow: 0 0 12px rgba(200,150,80,0.4);
    }

    /* Footer del teclado */
    .kbd-footer {
      display: flex;
      gap: 0.6rem;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .kbd-action-btn {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .kbd-action-btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .kbd-action-btn.secondary:hover {
      border-color: var(--accent-dim);
      color: var(--text);
    }

    /* Preview interno */
    .kbd-preview {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.7rem 1rem;
      font-family: var(--mono);
      font-size: 0.85rem;
      min-height: 40px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .kbd-preview-empty { color: var(--text-muted); opacity: 0.4; font-size: 0.75rem; }

    .kbd-token {
      color: var(--accent);
      background: rgba(124,92,252,0.15);
      padding: 0.1rem 0.4rem;
      border-radius: 2px;
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; padding: 1.5rem 1rem; }
      header { padding: 1rem 1.2rem; }
      footer { padding: 1rem 1.2rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">COMBO<span>MAKER</span></div>
    <button class="btn-export" data-game="twoexko" onclick="showGameKeyboard('twoexko')">2XKO</button>
    <button class="btn-export" data-game="generic" onclick="showGameKeyboard('generic')">Generic</button>

    <button class="btn-export" data-game="sf6" onclick="showGameKeyboard('sf6')">SF6</button>
  </header>
  <main>
    <!-- Editor -->
    <div class="editor-wrap">
      <div class="editor-header">
        <div class="editor-dot"></div>
        <span class="editor-label">Preview de tu combo</span>
      </div>

      <textarea
        id="combo-input"
        spellcheck="false"
        autocomplete="off"
        readonly
      ></textarea>
    </div>

    <section id="game-keyboards">

    <!-- TECLADO SF6 -->
    <div class="kbd-game-section" id="kbd-sf6" style="display:none;">
      <div class="kbd-header">
        <div class="kbd-title-row">
          <span class="kbd-game-badge">SF6</span>
          <h2 class="kbd-title">TECLADO PARA STREET FIGHTER 6</h2>
        </div>
      </div>
      <div class="kbd-layout" style="margin-top:1.5rem;">

          <div class="kbd-grid dir-grid" id="dir-grid-sf6"></div>
        </div>
        <div class="kbd-sep"></div>
        <div class="kbd-block">

    <!-- TECLADO TEKKEN 8 -->

      <div class="kbd-header">

          <span class="kbd-game-badge">T8</span>
          <h2 class="kbd-title">TECLADO PARA TEKKEN 8</h2>
        </div>
      </div>
      <div class="kbd-layout" style="margin-top:1.5rem;">
        <div class="kbd-block">
          <p class="kbd-block-label">MOVIMIENTO</p>
          <div class="kbd-grid dir-grid" id="dir-grid-tekken"></div>
        </div>
        <div class="kbd-sep"></div>
        <div class="kbd-block">
          <p class="kbd-block-label">BOTONES</p>
          <div class="kbd-grid btn-grid" id="btn-grid-tekken"></div>
        </div>
      </div>
      <div class="kbd-footer" style="margin-top:1rem;">
        <button class="kbd-action-btn secondary" onclick="clearLast()">⌫ Borrar último</button>
        <button class="kbd-action-btn secondary" onclick="clearAll()">⌧ Limpiar</button>
      </div>
    </div>

    <!-- TECLADO GENERIC -->
    <div class="kbd-game-section" id="kbd-generic" style="display:none;">
      <div class="kbd-header">
        <div class="kbd-title-row">
          <span class="kbd-game-badge">N</span>
          <h2 class="kbd-title">TECLADO GENERICO</h2>
        </div>
      </div>
      <div class="kbd-layout" style="margin-top:1.5rem;">
        <div class="kbd-block">
          <p class="kbd-block-label">MOVIMIENTO</p>
          <div class="kbd-grid dir-grid" id="dir-grid-generic"></div>
        </div>
        <div class="kbd-sep"></div>
        <div class="kbd-block">
          <p class="kbd-block-label">BOTONES</p>
          <div class="kbd-grid btn-grid" id="btn-grid-generic"></div>
        </div>
      </div>
      <div class="kbd-footer" style="margin-top:1rem;">
        <button class="kbd-action-btn secondary" onclick="clearLast()">⌫ Borrar último</button>
        <button class="kbd-action-btn secondary" onclick="clearAll()">⌧ Limpiar</button>
      </div>
    </div>

    <!-- TECLADO 2XKO -->
    <div class="kbd-game-section" id="kbd-twoexko" style="display:none;">
      <div class="kbd-header">
        <div class="kbd-title-row">
          <span class="kbd-game-badge">2XKO</span>
          <h2 class="kbd-title">TECLADO PARA 2XKO</h2>
        </div>
      </div>
      <div class="kbd-layout" style="margin-top:1.5rem;">
        <div class="kbd-block">
          <p class="kbd-block-label">MOVIMIENTO</p>
          <div class="kbd-grid dir-grid" id="dir-grid-twoexko"></div>
        </div>
        <div class="kbd-sep"></div>
        <div class="kbd-block">
          <p class="kbd-block-label">BOTONES</p>
          <div class="kbd-grid btn-grid" id="btn-grid-twoexko"></div>
        </div>
      </div>
      <div class="kbd-footer" style="margin-top:1rem;">
        <button class="kbd-action-btn secondary" onclick="clearLast()">⌫ Borrar último</button>
        <button class="kbd-action-btn secondary" onclick="clearAll()">⌧ Limpiar</button>
      </div>
    </div>

  </section>
  </main>


  <footer>COMBO MAKER - Hecho con Flask - Alvaro Bustos</footer>

  <script>
    // ── Token preview del editor principal ──
    const input   = document.getElementById('combo-input');
    const preview = document.getElementById('preview');

    // No input event since textarea is readonly
    // input.addEventListener('input', updateMainPreview);

    function updateMainPreview() {
      const raw = input.value.trim();
      if (!raw) {
        preview.innerHTML = '<span style="opacity:0.4">preview del combo...</span>';
        return;
      }
      const tokens = raw.split(/[\s,]+/).filter(Boolean);
      preview.innerHTML = tokens.map(t => `<span class="token">${escHtml(t)}</span>`).join(' ');
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Game keyboard sections ──
    let kbdTokens  = [];
    let currentGame = null;

    function showGameKeyboard(game) {
      // Hide all keyboard sections
      document.querySelectorAll('.kbd-game-section').forEach(el => el.style.display = 'none');
      document.getElementById('game-keyboards').style.display = 'block';

      // Show selected game
      const section = document.getElementById(`kbd-${game}`);
      if (section) {
        section.style.display = 'block';
        currentGame = game;
        // Render keyboards for this game
        renderKeyboard(game);
        // Clear tokens when switching games
        kbdTokens = [];
        renderKbdPreview();
      }
    }

    // Delegación de eventos para teclas del teclado (incluye dinámicas)
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.kbd-key');
      if (btn && currentGame) {
        const val = btn.dataset.val;
        kbdTokens.push(val);
        btn.classList.add('active');
        setTimeout(() => btn.classList.remove('active'), 160);
        renderKbdPreview();
      }
    });

    function renderKbdPreview() {
      if (!currentGame) return;
      const p = document.getElementById(`kbd-preview-${currentGame}`);
      if (!p) return;
      if (!kbdTokens.length) {
        p.innerHTML = '<span class="kbd-preview-empty">Sin entrada…</span>';
        return;
      }
      p.innerHTML = kbdTokens.map(t => `<span class="kbd-token">${escHtml(t)}</span>`).join(' ');
    }

    function clearLast() {
      kbdTokens.pop();
      renderKbdPreview();
    }

    function clearAll() {
      kbdTokens = [];
      renderKbdPreview();
    }

    function insertCombo() {
      if (!kbdTokens.length || !currentGame) return;
      const text = kbdTokens.join(' ');
      const ta = document.getElementById('combo-input');
      ta.value += (ta.value && !ta.value.endsWith(' ') ? ' ' : '') + text + ' ';
      kbdTokens = [];
      renderKbdPreview();
      updateMainPreview();
      ta.focus();
    }

    // Configuración de layouts por juego
    const gameLayouts = {
      sf6: {
        directions: [
          { cls: 'dir-key', val: '7', title: '↖', text: '↖' },
          { cls: 'dir-key', val: '8', title: '↑', text: '↑' },
          { cls: 'dir-key', val: '9', title: '↗', text: '↗' },
          { cls: 'dir-key', val: '4', title: '←', text: '←' },
          { cls: 'dir-key center-key', val: 'N', title: '·', text: 'N' },
          { cls: 'dir-key', val: '6', title: '→', text: '→' },
          { cls: 'dir-key', val: '1', title: '↙', text: '↙' },
          { cls: 'dir-key', val: '2', title: '↓', text: '↓' },
          { cls: 'dir-key', val: '3', title: '↘', text: '↘' },
          { cls: 'dir-key', val: 'cr', title: 'Crouch', text: 'cr' },
          { cls: 'dir-key', val: 'j', title: 'Jump', text: 'j' },
        ],
        buttons: [
          { cls: 'punch-key', val: 'LP', title: 'Light Punch', text: 'LP' },
          { cls: 'punch-key', val: 'MP', title: 'Medium Punch', text: 'MP' },
          { cls: 'punch-key', val: 'HP', title: 'Heavy Punch', text: 'HP' },
          { cls: 'kick-key', val: 'LK', title: 'Light Kick', text: 'LK' },
          { cls: 'kick-key', val: 'MK', title: 'Medium Kick', text: 'MK' },
          { cls: 'kick-key', val: 'HK', title: 'Heavy Kick', text: 'HK' },

    function renderKeyboard(game) {
      const layout = gameLayouts[game];
      if (!layout) return;

      // Update direction grid
      const dirGrid = document.getElementById(`dir-grid-${game}`);
      if (dirGrid) {
        dirGrid.innerHTML = '';
        layout.directions.forEach(btn => {
          const button = document.createElement('button');
          button.className = `kbd-key ${btn.cls}`;
          button.dataset.val = btn.val;
          button.title = btn.title;
          button.textContent = btn.text;
          dirGrid.appendChild(button);
        });
      }

      // Update button grid
      const btnGrid = document.getElementById(`btn-grid-${game}`);
      if (btnGrid) {
        btnGrid.innerHTML = '';
        layout.buttons.forEach(btn => {
          const button = document.createElement('button');
          button.className = `kbd-key ${btn.cls}`;
          button.dataset.val = btn.val;
          button.title = btn.title;
          button.textContent = btn.text;
          btnGrid.appendChild(button);
        });
      }
    }

    // Initialize keyboards (render all but keep hidden)
    ['sf6', 'tekken', 'generic', 'twoexko'].forEach(game => renderKeyboard(game));
  </script>
